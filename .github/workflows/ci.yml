name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release --parallel

      - name: Verify Executables
        run: |
          if (!(Test-Path "build\bin\Release\DiscordQuests.exe")) { throw "DiscordQuests.exe not found" }
          if (!(Test-Path "build\bin\Release\discord_dummy_stub.exe")) { throw "discord_dummy_stub.exe not found" }

      - name: Package Artifacts
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        run: |
          mkdir dist
          Copy-Item "build\bin\Release\DiscordQuests.exe" -Destination "dist\"
          Copy-Item "build\bin\Release\discord_dummy_stub.exe" -Destination "dist\"
          Compress-Archive -Path "dist\*" -DestinationPath "DiscordQuests-Windows-x64.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiscordQuests-Windows-x64
          path: DiscordQuests-Windows-x64.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DiscordQuests-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
